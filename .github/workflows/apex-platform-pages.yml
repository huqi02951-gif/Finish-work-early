name: APEX platform · Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'finish work early/**'
      - 'backend/**'
      - 'firmware/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Build and verify public content, ownership and credential boundaries
        run: npm run build
      - name: Publish static site to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LITTLE_CONCH_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '2a9ac3e8a020d8e4d0b77fb2ee17bb86'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing existing Cloudflare Pages deployment secret"
            exit 1
          fi
          npm exec --registry=https://registry.npmjs.org --yes --package=wrangler@4.149.0 -- wrangler pages deploy dist --project-name=apex-work-early --branch=main --commit-hash="$GITHUB_SHA"
