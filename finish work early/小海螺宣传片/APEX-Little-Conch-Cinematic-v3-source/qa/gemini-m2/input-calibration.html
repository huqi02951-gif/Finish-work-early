<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>iOS gesture calibration</title><style>body{margin:0;background:linear-gradient(#064b56,#763f87,#ccaa55);height:6000px;color:white;font:18px monospace}output{position:fixed;top:40px;left:20px;right:20px;white-space:pre-wrap;pointer-events:none;background:#001d2cdd;padding:20px}p{padding:200px 20px}section{height:500px;border-top:2px solid white}</style><output></output><p>Native scroll control.<br>Swipe up in the coloured area.</p><section>01</section><section>02</section><section>03</section><section>04</section><script>const counts={};function show(){document.querySelector('output').textContent=JSON.stringify({scrollY,height:document.documentElement.scrollHeight,viewport:innerHeight,...counts},null,2)}for(const e of ['touchstart','touchmove','touchend','pointerdown','pointermove','pointerup','scroll'])addEventListener(e,()=>{counts[e]=(counts[e]||0)+1;show()},{passive:true});show();</script></html>
